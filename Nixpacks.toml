[phases.setup]
nixPkgs = ['php84', 'php84Extensions.pdo_mysql', 'php84Extensions.mbstring', 'nodejs_20']

[phases.build]
cmds = [
  'composer install --no-dev --optimize-autoloader',
  'npm ci',
  'npm run build'
]

[variables]
NIXPACKS_NO_NPM_PRUNE = '1'

[start]
cmd = 'php artisan serve --host=0.0.0.0 --port=$PORT'